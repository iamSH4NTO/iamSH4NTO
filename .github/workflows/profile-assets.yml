name: Refresh profile assets

on:
  schedule:
    - cron: "17 3 * * *"      # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: iamSH4NTO
        run: python3 scripts/gen_profile_assets.py --out assets --source auto --print-report
      - name: Commit changed assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets)" ]; then
            git add assets
            git commit -m "chore: refresh profile assets"
            git push
          else
            echo "assets unchanged - nothing to commit"
          fi
